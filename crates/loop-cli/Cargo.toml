[package]
name = "loop-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Interactive coding agent CLI"
readme = "README.md"

[[bin]]
name = "loop"
path = "src/main.rs"

[features]
default = []
orchestration = ["loop-agent/orchestration", "dep:loop-orchestration"]
# Langfuse / OTLP tracing: `/tracing`, `--trace-*` flags. Off by default.
telemetry = ["loop-agent/telemetry", "loop-app-core/telemetry", "dep:loop-telemetry"]

[dependencies]
loop-app-core = { workspace = true }
loop-ai = { workspace = true }
loop-agent = { workspace = true, features = ["mcp"] }
loop-protocol = { workspace = true }
loop-orchestration = { workspace = true, optional = true }
loop-mcp = { workspace = true }
loop-update = { workspace = true }
loop-telemetry = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
dirs = { workspace = true }
anyhow = { workspace = true }
pulldown-cmark = { workspace = true }
termimad = { workspace = true }
ansi-to-tui = { workspace = true }
syntect = { workspace = true }
two-face = { workspace = true }
arboard = { workspace = true }
base64 = { workspace = true }
rhai = { workspace = true }
rustyline = { workspace = true }
unicode-width = { workspace = true }
walkdir = { workspace = true }
ignore = { workspace = true }
tempfile = { workspace = true }
regex = { workspace = true }
axum = { workspace = true }
rmcp = { workspace = true }

[[test]]
name = "print_trace"
required-features = ["telemetry"]

[[test]]
name = "tracing_command"
required-features = ["telemetry"]

[[test]]
name = "tracing_runtime"
required-features = ["telemetry"]

[dev-dependencies]
tempfile = { workspace = true }
loop-test-support = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
