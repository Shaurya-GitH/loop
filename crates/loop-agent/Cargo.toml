[package]
name = "loop-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Stateful agent with tool execution and event streaming"
readme = "README.md"

[features]
default = ["sqlite", "proxy", "web"]
sqlite = ["dep:rusqlite"]
proxy = ["dep:reqwest", "dep:eventsource-stream", "dep:bytes"]
# First-class `web_fetch` / `web_search` tools (SSRF-guarded HTTP client).
web = ["dep:reqwest"]
mcp = ["dep:loop-mcp", "dep:rmcp"]
orchestration = ["dep:loop-orchestration"]
# Langfuse / OTLP observations from the agent loop. Off by default.
telemetry = ["dep:loop-telemetry"]

[dependencies]
loop-ai = { workspace = true }
loop-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = { workspace = true }
parking_lot = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
similar = { workspace = true }
ignore = { workspace = true }
regex = { workspace = true }
base64 = { workspace = true }
mime_guess = { workspace = true }
walkdir = { workspace = true }
rusqlite = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
eventsource-stream = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
loop-orchestration = { workspace = true, optional = true }
loop-mcp = { workspace = true, optional = true }
loop-telemetry = { workspace = true, optional = true }
rmcp = { workspace = true, optional = true }

[[test]]
name = "telemetry"
required-features = ["telemetry"]

[dev-dependencies]
tempfile = { workspace = true }
loop-test-support = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tracing-subscriber = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
rusqlite = { workspace = true, features = ["bundled"] }
