[workspace]
resolver = "2"
members = [
    "crates/loop-ai",
    "crates/loop-orchestration",
    "crates/loop-mcp",
    "crates/loop-agent",
    "crates/loop-app-core",
    "crates/loop-telemetry",
    "crates/loop-test-support",
    "crates/loop-cli",
    "crates/ops/loop-update",
    "crates/core/loop-protocol",
    "crates/extend/loop-acp",
    "crates/loop-desktop"
]

default-members = [
    "crates/loop-ai",
    "crates/loop-orchestration",
    "crates/loop-mcp",
    "crates/loop-agent",
    "crates/loop-app-core",
    "crates/loop-telemetry",
    "crates/loop-test-support",
    "crates/loop-cli",
    "crates/ops/loop-update",
    "crates/core/loop-protocol",
    "crates/extend/loop-acp",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/soketlabs/loop"
rust-version = "1.88"

[workspace.dependencies]
loop-ai = { path = "crates/loop-ai" }
loop-agent = { path = "crates/loop-agent" }
loop-app-core = { path = "crates/loop-app-core" }
loop-orchestration = { path = "crates/loop-orchestration" }
loop-mcp = { path = "crates/loop-mcp" }
loop-telemetry = { path = "crates/loop-telemetry" }
loop-test-support = { path = "crates/loop-test-support" }
loop-update = { path = "crates/ops/loop-update" }
loop-protocol = { path = "crates/core/loop-protocol" }
loop-acp = { path = "crates/extend/loop-acp" }
agent-client-protocol-schema = { version = "1.11", default-features = false }
sha2 = "0.10"
semver = "1"
self-replace = "1.5"
flate2 = "1"
tar = { version = "0.4", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }
percent-encoding = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util", "signal", "net"] }
tokio-util = { version = "0.7", default-features = true }
futures = "0.3"
async-stream = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
eventsource-stream = "0.2"
bytes = "1"
jsonschema = { version = "0.29", default-features = false }
uuid = { version = "1", features = ["v7", "serde"] }
tracing = "0.1"
parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
similar = "2"
ignore = "0.4"
tempfile = "3"
regex = "1"
base64 = "0.22"
mime_guess = "2"
walkdir = "2"
clap = { version = "4", features = ["derive", "env"] }
ratatui = "0.30"
crossterm = { version = "0.28", features = ["event-stream"] }
dirs = "6"
anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client", "reqwest-rustls"] }
tracing-opentelemetry = { version = "0.34", default-features = false }
pulldown-cmark = "0.12"
termimad = "0.35"
ansi-to-tui = { version = "8", default-features = false }
syntect = { version = "5", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy", "dump-load"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
arboard = "3"
rhai = { version = "1.21", default-features = false, features = ["std", "sync"] }
rustyline = "15"
unicode-width = "0.2"
tokio-stream = { version = "0.1", features = ["sync"] }
rmcp = { git = "https://github.com/modelcontextprotocol/rust-sdk", rev = "3a2ebbc92034f6711e4eac9e93f5de0423be8dfe", default-features = false, features = ["client", "server", "macros", "transport-io", "transport-child-process", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "reqwest", "auth"] }
axum = "0.8"
tower = "0.5"

# GPUI desktop. Pin gpui-kit: the repo was renamed from gpui-component, and
# main dropped gpui-component-assets. Leave zed unpinned so it unifies with
# gpui-kit's zed git dep; after version bumps run `cargo update -w` (not
# `cargo generate-lockfile`) so HEAD git deps are not re-resolved.
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["x11", "wayland"] }
gpui-component = { git = "https://github.com/longbridge/gpui-kit", rev = "77a6e32a6e19074a8d257783c273271c9ed15f6a", package = "gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-kit", rev = "77a6e32a6e19074a8d257783c273271c9ed15f6a", package = "gpui-component-assets" }
async-channel = "2"
portable-pty = "0.9"

[profile.release]
lto = true
codegen-units = 1
strip = true
